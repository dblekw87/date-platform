<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1400" role="img" aria-label="장 시작 전 트레이딩 책상">
  <title>장 시작 전 트레이딩 책상</title>

  <!--
    Composed close to square so the panel can crop it either way: tall on
    desktop, a wide band on mobile. The monitors sit in the middle so they
    survive both crops, and the lower area stays quiet because the login copy
    is overlaid there.
  -->

  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f3ed" />
      <stop offset="1" stop-color="#e4d9cc" />
    </linearGradient>
    <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbd7e6" />
      <stop offset="0.55" stop-color="#e9dcd0" />
      <stop offset="1" stop-color="#f3ccb1" />
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17191b" />
      <stop offset="1" stop-color="#0c0d0f" />
    </linearGradient>
    <clipPath id="pane">
      <rect x="92" y="112" width="330" height="330" rx="8" />
    </clipPath>
  </defs>

  <rect width="1200" height="1400" fill="url(#room)" />

  <!-- Window: dawn over the skyline, the pre-market hour -->
  <g clip-path="url(#pane)">
    <rect x="92" y="112" width="330" height="330" fill="url(#dawn)" />
    <circle cx="338" cy="330" r="34" fill="#f7bd90" />
    <g fill="#b6a897" opacity="0.85">
      <rect x="96" y="300" width="48" height="142" />
      <rect x="150" y="252" width="40" height="190" />
      <rect x="196" y="330" width="34" height="112" />
      <rect x="236" y="282" width="46" height="160" />
      <rect x="288" y="346" width="30" height="96" />
      <rect x="324" y="306" width="40" height="136" />
      <rect x="370" y="360" width="28" height="82" />
    </g>
    <g fill="#f6ecdc" opacity="0.72">
      <rect x="158" y="270" width="7" height="9" /><rect x="172" y="270" width="7" height="9" />
      <rect x="158" y="292" width="7" height="9" /><rect x="245" y="300" width="7" height="9" />
      <rect x="259" y="300" width="7" height="9" /><rect x="245" y="322" width="7" height="9" />
      <rect x="333" y="326" width="7" height="9" /><rect x="347" y="326" width="7" height="9" />
    </g>
  </g>
  <g fill="none" stroke="#1a1a1a" stroke-width="5">
    <rect x="92" y="112" width="330" height="330" rx="8" />
    <line x1="257" y1="112" x2="257" y2="442" />
    <line x1="92" y1="277" x2="422" y2="277" />
  </g>

  <!-- Chart monitor -->
  <g>
    <rect x="288" y="470" width="612" height="404" rx="14" fill="#1a1a1a" />
    <rect x="306" y="488" width="576" height="368" rx="7" fill="url(#screen)" />

    <g stroke="#2b2f33" stroke-width="2">
      <line x1="338" y1="566" x2="850" y2="566" />
      <line x1="338" y1="646" x2="850" y2="646" />
      <line x1="338" y1="726" x2="850" y2="726" />
    </g>

    <!-- Red rises, blue falls: the domestic convention -->
    <g stroke-width="4">
      <g stroke="#e2564a" fill="#e2564a">
        <line x1="360" y1="738" x2="360" y2="800" /><rect x="351" y="752" width="18" height="36" />
        <line x1="424" y1="704" x2="424" y2="776" /><rect x="415" y="718" width="18" height="44" />
        <line x1="552" y1="668" x2="552" y2="734" /><rect x="543" y="680" width="18" height="40" />
        <line x1="616" y1="634" x2="616" y2="706" /><rect x="607" y="650" width="18" height="42" />
        <line x1="744" y1="588" x2="744" y2="656" /><rect x="735" y="600" width="18" height="40" />
        <line x1="808" y1="546" x2="808" y2="622" /><rect x="799" y="560" width="18" height="48" />
      </g>
      <g stroke="#5b8dd9" fill="#5b8dd9">
        <line x1="392" y1="726" x2="392" y2="794" /><rect x="383" y="740" width="18" height="40" />
        <line x1="456" y1="692" x2="456" y2="762" /><rect x="447" y="706" width="18" height="42" />
        <line x1="488" y1="678" x2="488" y2="748" /><rect x="479" y="692" width="18" height="42" />
        <line x1="584" y1="650" x2="584" y2="720" /><rect x="575" y="664" width="18" height="42" />
        <line x1="680" y1="612" x2="680" y2="680" /><rect x="671" y="626" width="18" height="42" />
        <line x1="712" y1="600" x2="712" y2="668" /><rect x="703" y="614" width="18" height="42" />
        <line x1="776" y1="568" x2="776" y2="636" /><rect x="767" y="582" width="18" height="42" />
      </g>
    </g>

    <polyline
      points="360,770 392,760 424,740 456,728 488,714 552,700 584,686 616,670 680,648 712,634 744,620 776,602 808,584"
      fill="none" stroke="#f4f1ea" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
  </g>

  <!-- Turnover ranking monitor -->
  <g>
    <rect x="924" y="560" width="252" height="314" rx="14" fill="#1a1a1a" />
    <rect x="942" y="578" width="216" height="278" rx="7" fill="url(#screen)" />
    <rect x="962" y="602" width="96" height="12" rx="6" fill="#6f7681" />
    <g fill="#2b2f33">
      <rect x="962" y="638" width="176" height="34" rx="6" />
      <rect x="962" y="684" width="176" height="34" rx="6" />
      <rect x="962" y="730" width="176" height="34" rx="6" />
      <rect x="962" y="776" width="176" height="34" rx="6" />
    </g>
    <g fill="#8f97a3">
      <rect x="976" y="650" width="66" height="10" rx="5" />
      <rect x="976" y="696" width="78" height="10" rx="5" />
      <rect x="976" y="742" width="58" height="10" rx="5" />
      <rect x="976" y="788" width="70" height="10" rx="5" />
    </g>
    <g>
      <rect x="1066" y="648" width="58" height="14" rx="7" fill="#e2564a" />
      <rect x="1078" y="694" width="46" height="14" rx="7" fill="#e2564a" />
      <rect x="1088" y="740" width="36" height="14" rx="7" fill="#5b8dd9" />
      <rect x="1096" y="786" width="28" height="14" rx="7" fill="#5b8dd9" />
    </g>
  </g>

  <!-- Stands -->
  <g fill="#1a1a1a">
    <rect x="566" y="874" width="56" height="34" />
    <rect x="498" y="900" width="192" height="16" rx="8" />
    <rect x="1026" y="874" width="46" height="34" />
    <rect x="974" y="900" width="150" height="16" rx="8" />
  </g>

  <!-- Open trade journal: the record the product is built around -->
  <g transform="translate(96 786)">
    <rect x="0" y="0" width="230" height="116" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="5" />
    <line x1="115" y1="0" x2="115" y2="116" stroke="#1a1a1a" stroke-width="5" />
    <g stroke="#c6bbae" stroke-width="5" stroke-linecap="round">
      <line x1="22" y1="30" x2="94" y2="30" />
      <line x1="22" y1="54" x2="94" y2="54" />
      <line x1="22" y1="78" x2="76" y2="78" />
      <line x1="137" y1="30" x2="209" y2="30" />
      <line x1="137" y1="54" x2="191" y2="54" />
    </g>
    <line x1="137" y1="78" x2="173" y2="78" stroke="#e2564a" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Mug -->
  <g transform="translate(370 818)">
    <path d="M0 18 h76 v46 a20 20 0 0 1 -20 20 h-36 a20 20 0 0 1 -20 -20 z"
      fill="#ffffff" stroke="#1a1a1a" stroke-width="5" />
    <path d="M76 32 h14 a14 14 0 0 1 0 28 h-14" fill="none" stroke="#1a1a1a" stroke-width="5" />
    <path d="M24 6 q10 -14 0 -28 M52 6 q10 -14 0 -28" fill="none" stroke="#b6aa9c" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Desk -->
  <rect x="40" y="902" width="1120" height="26" rx="7" fill="#1a1a1a" />
  <!-- Legs run to the bottom edge so a tall crop never leaves them hanging. -->
  <g fill="#1a1a1a" opacity="0.8">
    <rect x="150" y="928" width="22" height="472" />
    <rect x="1028" y="928" width="22" height="472" />
  </g>
</svg>
