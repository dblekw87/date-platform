<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="장 시작 전 트레이딩 책상">
  <title>장 시작 전 트레이딩 책상</title>

  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f3ed" />
      <stop offset="1" stop-color="#e6dcd0" />
    </linearGradient>
    <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfd9e6" />
      <stop offset="0.55" stop-color="#e9dcd0" />
      <stop offset="1" stop-color="#f2cdb4" />
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16181a" />
      <stop offset="1" stop-color="#0d0e10" />
    </linearGradient>
    <clipPath id="windowPane">
      <rect x="108" y="128" width="264" height="384" rx="6" />
    </clipPath>
  </defs>

  <rect width="1600" height="1000" fill="url(#room)" />

  <!-- Window: pre-market dawn over the skyline -->
  <g clip-path="url(#windowPane)">
    <rect x="108" y="128" width="264" height="384" fill="url(#dawn)" />
    <circle cx="300" cy="392" r="30" fill="#f6b98a" />
    <g fill="#b9ab9c" opacity="0.85">
      <rect x="112" y="360" width="42" height="152" />
      <rect x="160" y="316" width="34" height="196" />
      <rect x="200" y="392" width="30" height="120" />
      <rect x="236" y="344" width="40" height="168" />
      <rect x="282" y="408" width="26" height="104" />
      <rect x="314" y="368" width="36" height="144" />
      <rect x="356" y="424" width="24" height="88" />
    </g>
    <g fill="#f4ead9" opacity="0.7">
      <rect x="166" y="332" width="6" height="8" />
      <rect x="178" y="332" width="6" height="8" />
      <rect x="166" y="352" width="6" height="8" />
      <rect x="244" y="360" width="6" height="8" />
      <rect x="256" y="360" width="6" height="8" />
      <rect x="244" y="380" width="6" height="8" />
      <rect x="322" y="386" width="6" height="8" />
      <rect x="334" y="386" width="6" height="8" />
    </g>
  </g>
  <g fill="none" stroke="#1a1a1a" stroke-width="4">
    <rect x="108" y="128" width="264" height="384" rx="6" />
    <line x1="240" y1="128" x2="240" y2="512" />
    <line x1="108" y1="320" x2="372" y2="320" />
  </g>

  <!-- Chart monitor -->
  <g>
    <rect x="400" y="292" width="608" height="404" rx="12" fill="#1a1a1a" />
    <rect x="416" y="308" width="576" height="372" rx="6" fill="url(#screen)" />

    <!-- gridlines -->
    <g stroke="#2c3034" stroke-width="2">
      <line x1="448" y1="386" x2="960" y2="386" />
      <line x1="448" y1="470" x2="960" y2="470" />
      <line x1="448" y1="554" x2="960" y2="554" />
      <line x1="448" y1="638" x2="960" y2="638" />
    </g>

    <!-- candles: red rises, blue falls, the domestic convention -->
    <g stroke-width="4">
      <g stroke="#e2564a" fill="#e2564a">
        <line x1="470" y1="560" x2="470" y2="626" /><rect x="461" y="576" width="18" height="38" />
        <line x1="534" y1="524" x2="534" y2="600" /><rect x="525" y="540" width="18" height="46" />
        <line x1="662" y1="486" x2="662" y2="556" /><rect x="653" y="500" width="18" height="42" />
        <line x1="726" y1="452" x2="726" y2="528" /><rect x="717" y="470" width="18" height="44" />
        <line x1="854" y1="404" x2="854" y2="474" /><rect x="845" y="418" width="18" height="42" />
        <line x1="918" y1="360" x2="918" y2="440" /><rect x="909" y="376" width="18" height="50" />
      </g>
      <g stroke="#5b8dd9" fill="#5b8dd9">
        <line x1="502" y1="548" x2="502" y2="618" /><rect x="493" y="562" width="18" height="42" />
        <line x1="566" y1="512" x2="566" y2="586" /><rect x="557" y="528" width="18" height="44" />
        <line x1="598" y1="498" x2="598" y2="572" /><rect x="589" y="514" width="18" height="44" />
        <line x1="694" y1="468" x2="694" y2="542" /><rect x="685" y="484" width="18" height="44" />
        <line x1="790" y1="428" x2="790" y2="502" /><rect x="781" y="444" width="18" height="44" />
        <line x1="822" y1="416" x2="822" y2="490" /><rect x="813" y="432" width="18" height="44" />
        <line x1="886" y1="382" x2="886" y2="456" /><rect x="877" y="398" width="18" height="44" />
      </g>
    </g>

    <!-- trend line -->
    <polyline
      points="470,596 502,584 534,562 566,552 598,538 662,522 694,508 726,492 790,468 822,454 854,440 886,420 918,400"
      fill="none" stroke="#f4f1ea" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
  </g>

  <!-- Ranking monitor -->
  <g>
    <rect x="1048" y="360" width="392" height="336" rx="12" fill="#1a1a1a" />
    <rect x="1064" y="376" width="360" height="304" rx="6" fill="url(#screen)" />
    <rect x="1088" y="404" width="132" height="12" rx="6" fill="#6f7681" />
    <g fill="#2c3034">
      <rect x="1088" y="446" width="312" height="34" rx="6" />
      <rect x="1088" y="494" width="312" height="34" rx="6" />
      <rect x="1088" y="542" width="312" height="34" rx="6" />
      <rect x="1088" y="590" width="312" height="34" rx="6" />
    </g>
    <g fill="#8f97a3">
      <rect x="1104" y="458" width="96" height="10" rx="5" />
      <rect x="1104" y="506" width="112" height="10" rx="5" />
      <rect x="1104" y="554" width="84" height="10" rx="5" />
      <rect x="1104" y="602" width="104" height="10" rx="5" />
    </g>
    <g>
      <rect x="1316" y="456" width="68" height="14" rx="7" fill="#e2564a" />
      <rect x="1330" y="504" width="54" height="14" rx="7" fill="#e2564a" />
      <rect x="1340" y="552" width="44" height="14" rx="7" fill="#5b8dd9" />
      <rect x="1352" y="600" width="32" height="14" rx="7" fill="#5b8dd9" />
    </g>
  </g>

  <!-- Monitor stands -->
  <g fill="#1a1a1a">
    <rect x="676" y="696" width="56" height="40" />
    <rect x="608" y="726" width="192" height="14" rx="7" />
    <rect x="1220" y="696" width="48" height="40" />
    <rect x="1164" y="726" width="160" height="14" rx="7" />
  </g>

  <!-- Desk -->
  <rect x="60" y="740" width="1480" height="22" rx="6" fill="#1a1a1a" />
  <g fill="#1a1a1a" opacity="0.82">
    <rect x="150" y="762" width="20" height="180" />
    <rect x="1430" y="762" width="20" height="180" />
  </g>

  <!-- Trade journal: the open notebook the product is named for -->
  <g transform="translate(214 640)">
    <rect x="0" y="46" width="200" height="94" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="4" />
    <line x1="100" y1="46" x2="100" y2="140" stroke="#1a1a1a" stroke-width="4" />
    <g stroke="#c3b8ab" stroke-width="4" stroke-linecap="round">
      <line x1="18" y1="72" x2="82" y2="72" />
      <line x1="18" y1="92" x2="82" y2="92" />
      <line x1="18" y1="112" x2="66" y2="112" />
      <line x1="118" y1="72" x2="182" y2="72" />
      <line x1="118" y1="92" x2="166" y2="92" />
    </g>
    <line x1="118" y1="112" x2="150" y2="112" stroke="#e2564a" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Mug -->
  <g transform="translate(1290 660)">
    <path d="M0 20 h74 v46 a20 20 0 0 1 -20 20 h-34 a20 20 0 0 1 -20 -20 z"
      fill="#ffffff" stroke="#1a1a1a" stroke-width="4" />
    <path d="M74 34 h14 a14 14 0 0 1 0 28 h-14" fill="none" stroke="#1a1a1a" stroke-width="4" />
    <path d="M18 4 q8 -12 16 0 M42 4 q8 -12 16 0" fill="none" stroke="#b6aa9c" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Plant -->
  <g transform="translate(1470 612)">
    <path d="M34 128 q-38 -50 -30 -104 q30 20 34 74" fill="#9fb09a" />
    <path d="M42 128 q40 -44 36 -96 q-32 16 -38 68" fill="#8aa085" />
    <path d="M4 128 h72 l-10 60 h-52 z" fill="#ffffff" stroke="#1a1a1a" stroke-width="4" />
  </g>
</svg>
